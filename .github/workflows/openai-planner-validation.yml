name: OpenAI Planner Compatibility
on:
  pull_request:
    paths:
      - 'apps/api/app/services/openai_planner_runtime.py'
      - 'apps/api/app/services/operator_service.py'
      - 'apps/api/app/services/anthropic_runtime.py'
      - 'apps/api/tests/test_openai_planner_runtime.py'
      - 'apps/api/tests/test_planner_provider_evidence.py'
      - 'desktop/renderer/app.js'
      - 'desktop/renderer/index.html'
      - 'apps/api/app/static/companion.html'
      - 'apps/api/tests/test_job_visibility_renderer.py'
      - '.github/workflows/openai-planner-validation.yml'
  push:
    branches:
      - 'fix/restore-openai-operator-planner'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API requirements
        run: python -m pip install -r apps/api/requirements.txt pytest
      - name: Validate renderer JavaScript
        run: node --check desktop/renderer/app.js
      - name: Compile changed modules
        run: python -m py_compile apps/api/app/services/openai_planner_runtime.py apps/api/app/services/operator_service.py apps/api/app/services/anthropic_runtime.py
      - name: Run operations search shortcut regression
        run: python -m pytest apps/api/tests/test_job_visibility_renderer.py -k operations_search_keyboard_shortcut -v
      - name: Run cross-device refresh and null-safe companion regression tests
        run: python -m pytest apps/api/tests/test_job_visibility_renderer.py -k 'desktop_cross_device_operations_refresh or cross_device_operations_refresh_and_null_safe_parked_runs' -v
      - name: Run provider provenance regression tests
        env:
          PYTHONPATH: apps/api
        run: python -m unittest discover -s apps/api/tests -p test_planner_provider_evidence.py -v
      - name: Run adapter contract tests
        env:
          PYTHONPATH: apps/api
        run: python -m unittest discover -s apps/api/tests -p test_openai_planner_runtime.py -v
