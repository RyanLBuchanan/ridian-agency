<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>Ridian Companion</title>
<link rel="manifest" href="/companion/manifest.json">
<link rel="icon" href="/static/companion-icon-192.png">
<link rel="apple-touch-icon" href="/static/companion-apple-touch.png">
<style>
/* Inter v4.1, bundled and served by the backend (SIL OFL — see
   /static/fonts/Inter-LICENSE.txt). Same file the desktop ships, so both
   surfaces render the SAME face rather than Segoe UI here and Roboto there. */
@font-face {
  font-family: 'Inter';
  src: url('/static/fonts/InterVariable.woff2') format('woff2');
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
}

/* PALETTE lifted verbatim from the desktop renderer (styles.css) so the
   phone and the PC read as one product, not two that resemble each other —
   pinned by test_visual_identity_matches_the_desktop. The TYPE SCALE and
   touch tokens below it are deliberately the phone's own: this surface is
   read at arm's length and driven by thumbs. */
:root {
  --color-bg: #f7f8fa;
  --color-bg-soft: #f1f3f7;
  --color-surface: #ffffff;
  --color-surface-raised: #fbfcfe;

  --color-text-strong: #0f172a;
  --color-text: #1f2937;
  --color-muted: #4b5563;
  --color-muted-soft: #6b7280;

  --color-border: #e5e7eb;
  --color-border-strong: #d1d5db;

  --color-accent: #1d4ed8;
  --color-accent-deep: #1e3a8a;
  --color-accent-soft: #dbeafe;

  --color-error-bg: #fef2f2;
  --color-error-border: #fecaca;
  --color-error-text: #991b1b;

  --color-warn-bg: #fff7ed;
  --color-warn-border: #fed7aa;
  --color-warn-text: #9a3412;

  --color-success: #047857;
  --color-success-soft: #d1fae5;

  --shadow-soft: 0 6px 18px rgba(15, 23, 42, 0.05);
  --shadow-cta: 0 8px 22px rgba(29, 78, 216, 0.18);
  --gradient-primary: linear-gradient(180deg, #2657e0 0%, #1d4ed8 55%, #1c44b8 100%);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 999px;

  --space-1: 0.5rem;
  --space-2: 0.75rem;
  --space-3: 1rem;
  --space-4: 1.5rem;

  /* Phone type scale — larger than the desktop's on purpose, stepped up
     again in v6.9.6: the operator reads at arm's length with Android font
     scaling already raised, so the APP carries the size. Rem-based so the
     system setting still multiplies on top rather than being relied on. */
  --fs-xs: 0.9375rem;   /* 15px — badges, hints */
  --fs-sm: 1.0625rem;   /* 17px — meta lines, notes, log steps, buttons */
  --fs-body: 1.25rem;   /* 20px — body, inputs, cards */
  --fs-lead: 1.375rem;  /* 22px */
  --fs-eyebrow: 1rem;   /* 16px — section headings, tab labels */
  --touch-min: 48px;    /* minimum tap-target height: every button */
}

[data-theme="dark"] {
  --color-bg: #0f1117;
  --color-bg-soft: #181b23;
  --color-surface: #1c1f29;
  --color-surface-raised: #22252f;

  --color-text-strong: #e8eaf0;
  --color-text: #c9cdd6;
  --color-muted: #8b91a0;
  --color-muted-soft: #6b7186;

  --color-border: #2a2e3a;
  --color-border-strong: #3a3f4e;

  --color-accent: #5b8def;
  --color-accent-deep: #93b6ff;
  --color-accent-soft: #1e2c4a;

  --color-error-bg: #2d1518;
  --color-error-border: #5c2328;
  --color-error-text: #f87171;

  --color-warn-bg: #2d2013;
  --color-warn-border: #5c4216;
  --color-warn-text: #fbbf24;

  --color-success: #34d399;
  --color-success-soft: #0f2922;

  --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.25);
  --shadow-cta: 0 8px 22px rgba(91, 141, 239, 0.2);
  --gradient-primary: linear-gradient(180deg, #3b6ce8 0%, #2d5ee0 55%, #2753c8 100%);

  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  /* The desktop's exact stack: Inter when installed, else the platform face. */
  font-family: Inter, 'Segoe UI', Roboto, Arial, sans-serif;
  font-size: var(--fs-body);
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

.hidden { display: none !important; }

/* ---------- header: the desktop's sidebar-brand, laid out horizontally ---- */
header.brand {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: var(--space-2);
  padding: calc(var(--space-2) + env(safe-area-inset-top)) var(--space-3) var(--space-2);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
.brand-mark { width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; object-fit: contain; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand-name { font-weight: 650; font-size: var(--fs-body); color: var(--color-text-strong); }
/* The eyebrow names the machine this window looks through to — it has to
   be scannable at arm's length, so full text color, not a faded muted. */
.brand-sub {
  font-size: var(--fs-xs); color: var(--color-text); font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.brand-dot {
  margin-left: auto; flex-shrink: 0; width: 8px; height: 8px;
  border-radius: 50%; background: var(--color-success);
}
.brand-dot.is-stale { background: var(--color-warn-text); }

/* Fluid on any phone; capped only so tablet lines stay readable. */
main {
  padding: var(--space-3) var(--space-3) calc(112px + env(safe-area-inset-bottom));
  max-width: 680px; margin: 0 auto;
}

/* ---------- bottom nav ---------- */
nav {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex;
  background: var(--color-surface); border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
}
/* Four tabs, kept — but sized like tabs, not footnotes: icon above a
   16px label, generous vertical padding (the whole column is the target,
   min-height is a floor the content comfortably exceeds), and an active
   state readable at a glance: accent text + 3px bar + soft accent fill. */
nav button {
  flex: 1; background: none; border: 0; color: var(--color-muted);
  font: inherit; font-size: var(--fs-eyebrow); font-weight: 600;
  letter-spacing: 0.02em; min-height: var(--touch-min);
  padding: 10px 4px 12px; position: relative;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  border-top: 3px solid transparent; margin-top: -1px;
}
nav button svg { width: 26px; height: 26px; }
nav button.active {
  color: var(--color-accent); border-top-color: var(--color-accent);
  background: var(--color-accent-soft);
}
nav button .cnt {
  position: absolute; top: 6px; right: 18%;
  background: var(--color-error-text); color: #fff;
  border-radius: var(--radius-pill);
  font-size: 12.5px; font-weight: 700; min-width: 20px; padding: 1px 6px;
}

/* ---------- cards ---------- */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-soft);
  padding: var(--space-3);
  margin-bottom: var(--space-2);
}
.card-title { font-weight: 600; color: var(--color-text-strong); }
/* Meta lines carry real data ("next: 2026-09-01", the staged command) —
   the stronger muted, at note size, so they scan without leaning in. */
.meta {
  color: var(--color-muted); font-size: var(--fs-sm);
  margin-top: 4px; overflow-wrap: anywhere;
}

/* Section eyebrows (OBLIGATIONS DUE, TODAY'S CALENDAR) — full text color
   at their own step, not small grey caps. */
h2 {
  font-size: var(--fs-eyebrow); text-transform: uppercase; letter-spacing: 0.06em;
  font-weight: 700; color: var(--color-text);
  margin: var(--space-4) 2px var(--space-1);
}

/* Brief items are the page's primary reading — strong color, never the
   dimmest thing on screen. */
#brief-body .card { color: var(--color-text-strong); }

/* ---------- buttons: the desktop .btn family ---------- */
.btn {
  font: inherit; font-size: var(--fs-sm); font-weight: 600;
  border-radius: var(--radius-md); padding: 0.55rem 1.1rem; cursor: pointer;
  border: 1px solid transparent; line-height: 1.2;
  min-height: var(--touch-min);
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  white-space: nowrap;
  transition: transform 80ms ease, box-shadow 120ms ease, background 120ms ease;
}
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--gradient-primary); color: #fff; box-shadow: var(--shadow-cta); }
.btn-primary:active:not(:disabled) { transform: translateY(1px); }
.btn-ghost {
  background: var(--color-surface); color: var(--color-text);
  border-color: var(--color-border-strong);
}
.btn-ghost:active:not(:disabled) { background: var(--color-bg-soft); }
/* "Compact" is horizontal density only — the touch height never shrinks. */
.btn-compact { font-size: var(--fs-sm); padding: 0.4rem 0.9rem; }
.row-btns { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-2); }

/* ---------- badges ---------- */
.badge {
  display: inline-block; font-size: 13px; font-weight: 700;
  letter-spacing: 0.04em; border-radius: var(--radius-sm);
  padding: 2px 8px; vertical-align: 1px; border: 1px solid transparent;
}
.badge.due { background: var(--color-warn-bg); color: var(--color-warn-text); border-color: var(--color-warn-border); }
.badge.over { background: var(--color-error-bg); color: var(--color-error-text); border-color: var(--color-error-border); }
.badge.stale { background: var(--color-warn-bg); color: var(--color-warn-text); border-color: var(--color-warn-border); }

/* ---------- text states ---------- */
.note { color: var(--color-muted); font-size: var(--fs-sm); }
.err { color: var(--color-error-text); font-size: var(--fs-sm); white-space: pre-wrap; }
.okline { color: var(--color-success); font-size: var(--fs-sm); font-weight: 600; }

/* ---------- composer ---------- */
.composer {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-soft);
  padding: var(--space-2); margin-bottom: var(--space-2);
}
.composer:focus-within { border-color: var(--color-accent); }
textarea, input[type=text] {
  width: 100%; background: transparent; color: var(--color-text);
  border: 0; padding: 4px 2px; font: inherit; font-size: var(--fs-body);
}
textarea { min-height: 82px; resize: none; }
textarea:focus, input[type=text]:focus { outline: none; }
textarea::placeholder, input::placeholder { color: var(--color-muted-soft); }
.composer-actions { display: flex; align-items: center; gap: var(--space-1); margin-top: 4px; }
.composer-hint { color: var(--color-muted-soft); font-size: var(--fs-xs); margin-right: auto; }

/* ---------- pairing + boot failure (same centered treatment) ---------- */
#pair-view, #boot-view { max-width: 420px; margin: 10vh auto 0; padding: 0 var(--space-4); text-align: center; }
#pair-view img, #boot-view img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: var(--space-3); }
#pair-view h1, #boot-view h1 { font-size: var(--fs-lead); color: var(--color-text-strong); margin: 0 0 var(--space-2); }
#pair-view .note { text-align: left; }
#boot-view .err { text-align: left; margin-bottom: var(--space-3); }
#boot-retry { width: 100%; }
#pair-view .field {
  background: var(--color-surface); border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md); padding: 0.6rem 0.8rem; margin: var(--space-2) 0;
}
#pair-view .field:focus-within { border-color: var(--color-accent); }
#pair-code { letter-spacing: 0.16em; font-weight: 600; text-transform: uppercase; }
#pair-btn { width: 100%; }

/* ---------- run log ---------- */
#run-log .step { color: var(--color-muted); font-size: var(--fs-sm); padding: 4px 0; }
#run-log .step.done::before { content: "\2713  "; color: var(--color-success); font-weight: 700; }
#run-log .step.run::before { content: "\2026  "; color: var(--color-warn-text); font-weight: 700; }
/* Response text is the longest read on the page — breathing room between
   paragraphs so it never becomes a wall. */
#run-log .msg { padding: 10px 0; white-space: pre-wrap; line-height: 1.65; }
.qbox {
  background: var(--color-accent-soft); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-2); margin: var(--space-2) 0;
}
.qbox .q { font-weight: 600; color: var(--color-text-strong); }
</style>
</head>
<body>

<div id="pair-view" class="hidden">
  <img src="/static/companion-icon-192.png" alt="">
  <h1>Pair with your PC</h1>
  <p class="note">In Ridian on the PC: Settings &rarr; Phone &rarr;
    <b>Pairing code</b>, then type the code here.</p>
  <div class="field"><input type="text" id="pair-code" placeholder="Pairing code"
      autocapitalize="characters" autocomplete="one-time-code" enterkeyhint="go"></div>
  <div class="field"><input type="text" id="pair-name" placeholder="This device's name (e.g. Pixel 7)"></div>
  <button class="btn btn-primary" id="pair-btn">Pair</button>
  <p class="err" id="pair-err"></p>
</div>

<!-- Boot failure that is NOT the pairing 401: a blank page is a fake state
     too, so name the failure and offer the retry. -->
<div id="boot-view" class="hidden">
  <img src="/static/companion-icon-192.png" alt="">
  <h1>Can't reach the PC</h1>
  <p class="err" id="boot-msg"></p>
  <button class="btn btn-primary" id="boot-retry">Retry</button>
</div>

<div id="app-view" class="hidden">
  <header class="brand">
    <img class="brand-mark" src="/static/companion-icon-192.png" alt="" aria-hidden="true">
    <span class="brand-text">
      <span class="brand-name">Ridian Operator</span>
      <span class="brand-sub" id="brand-sub">Connecting...</span>
    </span>
    <span class="brand-dot" id="brand-dot" title="Connected"></span>
  </header>
  <main>
    <!-- Task is the landing surface: an agent app opens on its command line. -->
    <section id="tab-task">
      <div class="composer">
        <textarea id="task-input" enterkeyhint="send"
          placeholder="Tell Ridian what to do. It runs on the PC, through every gate."></textarea>
        <div class="composer-actions">
          <span class="composer-hint" id="task-hint">Runs on the PC</span>
          <button class="btn btn-primary btn-compact" id="task-run">Run</button>
        </div>
      </div>
      <div id="run-status" class="note"></div>
      <div id="run-question"></div>
      <div id="run-log"></div>
      <h2>Waiting on you</h2>
      <div id="awaiting-list" class="note">Loading...</div>
    </section>
    <section id="tab-due" class="hidden">
      <div id="due-list" class="note">Loading...</div>
      <h2>All obligations</h2>
      <div id="ob-list" class="note">Loading...</div>
    </section>
    <section id="tab-brief" class="hidden">
      <div id="brief-body" class="note">Loading...</div>
    </section>
    <section id="tab-approvals" class="hidden">
      <div id="appr-list" class="note">Loading...</div>
    </section>
  </main>
  <nav>
    <button data-tab="task" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 17 6-6-6-6"/><line x1="12" y1="19" x2="20" y2="19"/></svg>Task</button>
    <button data-tab="due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Due<span class="cnt hidden" id="cnt-due"></span></button>
    <button data-tab="brief"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Brief</button>
    <button data-tab="approvals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>Approvals<span class="cnt hidden" id="cnt-appr"></span></button>
  </nav>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

/* Mirror the desktop's applyTheme so the phone follows the PC's choice. */
function applyTheme(pref) {
  const val = String(pref || "system").toLowerCase();
  const dark = val === "dark" ||
    (val !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0f1117" : "#f7f8fa");
}
applyTheme("system");          // before first paint; refined once /me answers

function showPair() {
  $("app-view").classList.add("hidden");
  $("pair-view").classList.remove("hidden");
  $("pair-code").focus();
}

/* Every request gets a hard deadline. Over a Tailscale relay a dropped or
   half-open connection leaves fetch pending FOREVER on mobile — it neither
   resolves nor rejects, so without a deadline "Loading..." is a state the
   page can never leave. Reads are safe to abort and retry; writes get a
   longer leash (the PC may genuinely be executing the action) and a message
   that is honest about not knowing the outcome. */
const READ_TIMEOUT_MS = 45000;
const WRITE_TIMEOUT_MS = 120000;

async function api(path, opts) {
  opts = opts || {};
  const method = (opts.method || "GET").toUpperCase();
  const headers = Object.assign({}, opts.headers);
  if (method !== "GET") {
    headers["X-Ridian-Companion"] = "1";
    if (opts.body) headers["Content-Type"] = "application/json";
  }
  const ms = method === "GET" ? READ_TIMEOUT_MS : WRITE_TIMEOUT_MS;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  let res;
  try {
    res = await fetch(path, Object.assign({}, opts, { headers, signal: ctrl.signal }));
  } catch (e) {
    if (ctrl.signal.aborted) {
      throw new Error(method === "GET"
        ? `The PC did not answer within ${Math.round(ms / 1000)}s — the ` +
          "connection may be slow or the PC busy."
        : `No answer from the PC within ${Math.round(ms / 1000)}s — the ` +
          "action may still have completed on the PC. Check before retrying.");
    }
    throw new Error("Could not reach the PC: " + (e.message || "network error"));
  } finally { clearTimeout(timer); }
  if (res.status === 401) { showPair(); throw new Error("Not paired."); }
  let data = null;
  try { data = await res.json(); } catch (_e) { /* non-JSON */ }
  if (!res.ok) throw new Error((data && data.detail) || ("HTTP " + res.status));
  return data;
}

/* Every load ends in one of three honest states: content, an error with a
   Retry, or the explicit timeout above (also with Retry). "Loading..." is a
   transit state, never a destination. */
function failState(id, e, retry) {
  const box = document.createElement("div");
  box.className = "card";
  box.innerHTML = `<p class="err">${esc(e.message)}</p>
    <div class="row-btns"><button class="btn btn-ghost">Retry</button></div>`;
  box.querySelector("button").addEventListener("click", retry);
  const host = $(id);
  host.innerHTML = "";
  host.appendChild(box);
}

/* ---------------- pairing ---------------- */
async function doPair() {
  $("pair-err").textContent = "";
  try {
    await api("/companion/pair", { method: "POST", body: JSON.stringify({
      code: $("pair-code").value.trim(),
      device_name: $("pair-name").value.trim() }) });
    location.reload();
  } catch (e) { $("pair-err").textContent = e.message; }
}
$("pair-btn").addEventListener("click", doPair);
$("pair-code").addEventListener("keydown", (e) => { if (e.key === "Enter") doPair(); });
$("pair-name").addEventListener("keydown", (e) => { if (e.key === "Enter") doPair(); });

/* ---------------- tabs ---------------- */
const TABS = ["task", "due", "brief", "approvals"];
const LOADERS = { due: loadDue, brief: loadBrief, approvals: loadApprovals,
                  task: loadAwaiting };
document.querySelectorAll("nav button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    TABS.forEach((t) => $("tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
    (LOADERS[b.dataset.tab] || (() => {}))();
  });
});
function openTab(name) {
  document.querySelector('nav button[data-tab="' + name + '"]').click();
}

/* ---------------- due / obligations ---------------- */
function dueBadge(d) {
  return d.status === "overdue"
    ? `<span class="badge over">OVERDUE ${d.days_overdue}d</span>`
    : `<span class="badge due">DUE TODAY</span>`;
}
function setCount(id, n) {
  const el = $(id);
  el.classList.toggle("hidden", !n);
  el.textContent = n;
}
async function loadDue() {
  try {
    const data = await api("/obligations");
    const due = data.due || [];
    setCount("cnt-due", due.length);
    $("due-list").innerHTML = due.length ? "" : '<p class="note">Nothing is due.</p>';
    due.forEach((d) => {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div>${dueBadge(d)} <span class="card-title">${esc(d.name)}</span></div>
        <div class="meta">Due ${esc(d.due_date)}${d.missed_periods ? ` &middot; ${d.missed_periods} earlier missed` : ""}</div>
        <div class="meta">Task: ${esc(d.task)}</div>
        <div class="row-btns">
          <button class="btn btn-primary btn-compact st">Start task</button>
          <button class="btn btn-ghost btn-compact mc">Mark complete</button>
          <button class="btn btn-ghost btn-compact dm">Dismiss this one</button>
        </div>`;
      el.querySelector(".st").addEventListener("click", () => {
        $("task-input").value = d.task; openTab("task"); runTask();
      });
      el.querySelector(".mc").addEventListener("click", async () => {
        if (!confirm(`Mark "${d.name}" complete for ${d.due_date}?`)) return;
        try { await api(`/obligations/${encodeURIComponent(d.id)}/complete`, { method: "POST" }); }
        catch (e) { alert(e.message); }
        loadDue();
      });
      el.querySelector(".dm").addEventListener("click", async () => {
        if (!confirm(`Skip the ${d.due_date} occurrence of "${d.name}"? It will not come back; the next occurrence still will.`)) return;
        try { await api(`/obligations/${encodeURIComponent(d.id)}/dismiss`, { method: "POST" }); }
        catch (e) { alert(e.message); }
        loadDue();
      });
      $("due-list").appendChild(el);
    });
    const obs = data.obligations || [];
    $("ob-list").innerHTML = obs.length
      ? obs.map((o) => `<div class="card"><span class="card-title">${esc(o.name)}</span>
          <div class="meta">${o.due ? dueBadge(o.due) : "next: " + esc(o.next_due || "—")}</div>
          <div class="meta">Task: ${esc(o.task)}</div></div>`).join("")
      : '<p class="note">No obligations yet &mdash; add them on the PC.</p>';
  } catch (e) {
    failState("due-list", e, loadDue);
  }
}

/* ---------------- brief ---------------- */
const BRIEF_ORDER = [
  ["obligations_due", "Obligations due", (i) => `${i.status === "overdue" ? "OVERDUE " + i.days_overdue + "d — " : "Due today — "}${i.name}`],
  ["today_events", "Today's calendar", (i) => `${i.all_day ? "All day" : String(i.start || "").replace("T", " ").slice(11, 16)} — ${i.summary}`],
  // The sender is contact.name (the contacts join) or last_from — the SAME
  // fields the desktop brief reads. No sender: the subject alone, never an
  // orphaned ": Subject".
  ["needs_reply", "Needs a reply", (i) => {
    const who = (i.contact && i.contact.name) || i.last_from || "";
    return who ? `${who}: ${i.subject || ""}` : (i.subject || "");
  }],
  ["due_today", "Due today", (i) => `${i.overdue ? "OVERDUE — " : ""}${i.title} (${i.next_action || ""})`],
  ["due_this_week", "Due this week", (i) => `${i.title} — ${i.next_action_date || ""}`],
  ["stale_deals", "Gone quiet", (i) => i.title],
  ["unpaid_invoices", "Unpaid invoices", (i) => `#${i.doc_number} ${i.customer} — $${i.balance}`],
  ["awaiting_approval", "Awaiting approval", (i) => i.question || i.command],
];
async function loadBrief() {
  $("brief-body").innerHTML = '<p class="note">Loading...</p>';
  try {
    const brief = await api("/morning-brief");
    const s = brief.sections || {};
    $("brief-body").innerHTML = BRIEF_ORDER.map(([key, title, fmt]) => {
      const sec = s[key] || { items: [], empty: true, note: "" };
      let body;
      if (sec.unavailable) body = `<p class="err">${esc(sec.note)}</p>`;
      else if (sec.empty) body = `<p class="note">${esc(sec.note)}</p>`;
      else body = sec.items.map((i) => `<div class="card">${esc(fmt(i))}</div>`).join("");
      return `<h2>${esc(title)}</h2>${body}`;
    }).join("");
  } catch (e) {
    failState("brief-body", e, loadBrief);
  }
}

/* ---------------- approvals ---------------- */
async function loadApprovals() {
  try {
    const data = await api("/approvals");
    const list = data.approvals || [];
    setCount("cnt-appr", list.length);
    $("appr-list").innerHTML = list.length ? "" : '<p class="note">Nothing awaiting approval.</p>';
    list.forEach((a) => {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div><span class="card-title">${esc(a.question || a.tool)}</span>
          ${a.stale ? ' <span class="badge stale">STALE</span>' : ""}</div>
        <div class="meta">${esc(a.command || a.operation_id)}</div>
        <div class="meta">${esc(a.staged_at)}</div>
        <div class="row-btns"></div><div class="err"></div>`;
      const btns = el.querySelector(".row-btns");
      (a.options || []).forEach((o, i) => {
        const b = document.createElement("button");
        b.className = "btn btn-compact " + (i === 0 ? "btn-primary" : "btn-ghost");
        b.textContent = o.label;
        b.addEventListener("click", async () => {
          btns.querySelectorAll("button").forEach((x) => x.disabled = true);
          try {
            const out = await api("/approvals/answer", { method: "POST",
              body: JSON.stringify({ id: a.id, value: o.value }) });
            if (out.error) throw new Error(out.error + (out.detail ? " — " + out.detail : ""));
            const line = el.querySelector(".err");
            line.className = "okline";
            line.textContent = out.approved ? "Approved" : "Declined";
            setTimeout(loadApprovals, 1200);
          } catch (e) {
            el.querySelector(".err").textContent = e.message;
            btns.querySelectorAll("button").forEach((x) => x.disabled = false);
          }
        });
        btns.appendChild(b);
      });
      $("appr-list").appendChild(el);
    });
  } catch (e) {
    failState("appr-list", e, loadApprovals);
  }
}

/* ---------------- task run (SSE over fetch) ---------------- */
let currentOpId = "";
function sseBlocks(block, onEvent) {
  let ev = "message", data = "";
  block.split("\n").forEach((line) => {
    if (line.startsWith("event:")) ev = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  });
  if (data) onEvent(ev, (() => { try { return JSON.parse(data); } catch (_e) { return {}; } })());
}
async function streamRun(url, body) {
  // Deadline on the HANDSHAKE only: "Starting..." must not be a state the
  // page can never leave. Once the PC answers and the stream is live, a run
  // is open-ended BY DESIGN — the timer is cleared before the first read.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), READ_TIMEOUT_MS);
  let res;
  try {
    res = await fetch(url, { method: "POST", headers: {
      "Content-Type": "application/json", "Accept": "text/event-stream",
      "X-Ridian-Companion": "1" }, body: JSON.stringify(body),
      signal: ctrl.signal });
  } catch (e) {
    throw new Error(ctrl.signal.aborted
      ? `The PC did not answer within ${Math.round(READ_TIMEOUT_MS / 1000)}s` +
        ' — the run may not have started. Check "Waiting on you" or retry.'
      : "Could not reach the PC: " + (e.message || "network error"));
  } finally { clearTimeout(timer); }
  if (res.status === 401) { showPair(); return; }
  if (!res.ok) {
    let d = null; try { d = await res.json(); } catch (_e) {}
    throw new Error((d && d.detail) || ("HTTP " + res.status));
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) !== -1) {
      sseBlocks(buf.slice(0, idx), handleRunEvent);
      buf = buf.slice(idx + 2);
    }
  }
}
function handleRunEvent(ev, d) {
  const log = $("run-log");
  if (ev === "start") {
    currentOpId = d.id || currentOpId;
    $("run-status").textContent = d.resumed ? "Resumed on the PC..." : "Running on the PC...";
  } else if (ev === "step") {
    const line = document.createElement("div");
    line.className = "step " + (d.status === "completed" ? "done" : "run");
    line.textContent = d.name + (d.detail ? " — " + d.detail : "");
    log.appendChild(line);
  } else if (ev === "message") {
    if (String(d.text || "").startsWith("Planner →")) return;
    const line = document.createElement("div");
    line.className = "msg"; line.textContent = d.text || "";
    log.appendChild(line);
  } else if (ev === "error") {
    const line = document.createElement("div");
    line.className = "err"; line.textContent = d.message || "error";
    log.appendChild(line);
  } else if (ev === "needs_input") {
    renderQuestion($("run-question"), currentOpId, d);
    $("run-status").textContent = "Waiting on you.";
  } else if (ev === "complete") {
    const st = d.status || "";
    $("run-status").textContent = "Status: " + st +
      (d.artifacts && d.artifacts.length ? ` · ${d.artifacts.length} artifact(s) on the PC` : "");
    if (st !== "awaiting_input") $("run-question").innerHTML = "";
    loadAwaiting(); loadApprovals(); loadDue();
  }
}
function renderQuestion(container, opId, need) {
  container.innerHTML = "";
  const box = document.createElement("div");
  box.className = "qbox";
  box.innerHTML = `<div class="q">${esc(need.question)}</div>
    ${need.task_summary ? `<div class="meta">${esc(need.task_summary)}</div>` : ""}
    <div class="row-btns"></div>`;
  const btns = box.querySelector(".row-btns");
  (need.options || []).forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "btn btn-compact " +
      (o.action === "submit" && i === 0 ? "btn-primary" : "btn-ghost");
    b.textContent = o.label;
    if (o.action === "submit") {
      b.addEventListener("click", () => answerOp(opId, o.value || o.label));
    } else if (o.action === "compose") {
      b.addEventListener("click", () => {
        $("task-input").value = o.prefill || "";
        $("task-input").placeholder = o.placeholder || "Finish and press Answer";
        armAnswer(opId);
        $("task-input").focus();
      });
    } else {
      b.disabled = true;
      if (o.action === "upload") b.textContent += " (PC only)";
    }
    btns.appendChild(b);
  });
  if (!need.buttons_only) {
    const hint = document.createElement("div");
    hint.className = "meta";
    hint.textContent = "Or type an answer above and press Answer.";
    box.appendChild(hint);
    armAnswer(opId);
  }
  container.appendChild(box);
}
function armAnswer(opId) {
  $("task-run").textContent = "Answer";
  $("task-run").dataset.answerOp = opId;
  $("task-hint").textContent = "Answering the parked task";
}
function disarmAnswer() {
  $("task-run").textContent = "Run";
  $("task-run").dataset.answerOp = "";
  $("task-hint").textContent = "Runs on the PC";
  $("task-input").placeholder = "Tell Ridian what to do. It runs on the PC, through every gate.";
}
async function answerOp(opId, value) {
  $("run-question").innerHTML = "";
  $("run-status").textContent = "Sending answer...";
  try { await streamRun(`/operations/${encodeURIComponent(opId)}/continue`, { answer: value }); }
  catch (e) { $("run-status").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
async function runTask() {
  const cmd = $("task-input").value.trim();
  if (!cmd) { $("task-input").focus(); return; }
  const answerOpId = $("task-run").dataset.answerOp;
  $("task-input").value = "";
  disarmAnswer();
  if (answerOpId) { currentOpId = answerOpId; return answerOp(answerOpId, cmd); }
  $("run-log").innerHTML = ""; $("run-question").innerHTML = "";
  $("run-status").textContent = "Starting...";
  try {
    await streamRun("/operations/run", { command: cmd, project_id: "",
      research_model: "", script_model: "", effort: "", background: false });
  } catch (e) {
    $("run-status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}
$("task-run").addEventListener("click", runTask);
$("task-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runTask(); }
});

/* ---------------- parked runs ---------------- */
async function loadAwaiting() {
  try {
    const data = await api("/operations/recent?limit=50");
    const waiting = (data.operations || []).filter((o) => o.status === "awaiting_input");
    $("awaiting-list").innerHTML = waiting.length ? "" : '<p class="note">Nothing is parked.</p>';
    waiting.forEach((o) => {
      const need = (o.needs_input || [])[o.needs_input.length - 1];
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div class="meta">${esc(o.command)}</div><div class="qwrap"></div>
        <div class="row-btns"><button class="btn btn-ghost btn-compact cancel">Cancel task</button></div>`;
      if (need) renderQuestion(el.querySelector(".qwrap"), o.id, need);
      el.querySelector(".cancel").addEventListener("click", async () => {
        if (!confirm("Cancel this parked task?")) return;
        try { await api(`/operations/${encodeURIComponent(o.id)}/dismiss`, { method: "POST" }); }
        catch (e) { alert(e.message); }
        loadAwaiting();
      });
      $("awaiting-list").appendChild(el);
    });
  } catch (e) {
    failState("awaiting-list", e, loadAwaiting);
  }
}

/* ---------------- boot ---------------- */
(async function boot() {
  try {
    const me = await api("/companion/me");
    applyTheme(me.appearance);
    // The header names the PC this window looks THROUGH to, not the phone.
    const pc = me.pc_name || "this PC";
    $("brand-sub").textContent = "Connected to " + pc + (me.name ? " · " + me.name : "");
    $("brand-sub").title = me.company ? me.company + " · " + pc : pc;
    $("app-view").classList.remove("hidden");
    // Task is the landing surface: ready to type the moment it opens.
    $("task-input").focus({ preventScroll: true });
    loadAwaiting(); loadDue(); loadApprovals();
    setInterval(() => {
      if (!$("app-view").classList.contains("hidden")) { loadDue(); loadApprovals(); }
    }, 60000);
  } catch (e) {
    // A 401 already swapped in the pairing view. Any OTHER boot failure
    // must not strand a blank page: name it and offer the retry.
    if ($("pair-view").classList.contains("hidden")) {
      $("boot-msg").textContent = e.message || "Could not reach the PC.";
      $("boot-view").classList.remove("hidden");
    }
  }
})();
$("boot-retry").addEventListener("click", () => location.reload());
</script>
